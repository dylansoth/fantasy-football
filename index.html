<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punter Fantasy Leaderboard</title>
    <!-- Google Fonts for Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Link to Modular stylesheet (Core Skill: Separation of Concerns) -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Link to Javascript with 'defer' (Core Skill: Non-blocking Script Loading) -->
    <script defer src="app.js"></script>
</head>
<body>

    <div class="glow-decoration-1"></div>
    <div class="glow-decoration-2"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="status-badge">
                <span class="pulse"></span>
                Weekly Calculations Active
            </div>
            <h1>Punter Leaderboard</h1>
            <p class="subtitle">Custom 2026 Scoring Rules: 0.04/Yd, +1.5/i20, +3.0/i10, -1.0/TB, -3.0/Blk</p>
        </header>

        <!-- Control Bar (Interactive Search) -->
        <div class="control-bar">
            <input type="text" id="search-input" placeholder="🔍 Search punter or team..." autocomplete="off">
        </div>

        <!-- Leaderboard Table Container -->
        <div class="table-card">
            
            <!-- Loading Indicator -->
            <div id="loading" class="state-message">
                <div class="spinner"></div>
                Fetching leaderboard data...
            </div>

            <!-- Error State Message -->
            <div id="error-message" class="state-message error hidden">
                ⚠️ Failed to load leaderboard data. Ensure python scores generated correctly.
            </div>

            <!-- Roster Table -->
            <table id="leaderboard-table" class="hidden">
                <thead>
                    <tr>
                        <th class="col-rank">Rank</th>
                        <th class="col-name">Player</th>
                        <th class="col-team">Team</th>
                        <th class="col-num">Punts</th>
                        <th class="col-num">Yds</th>
                        <th class="col-num">i20</th>
                        <th class="col-num">i10</th>
                        <th class="col-num">TB</th>
                        <th class="col-num">Blk</th>
                        <th class="col-score">Score</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- Dynamic rows will be injected here by app.js -->
                </tbody>
            </table>
        </div>

        <!-- Footer -->
        <footer>
            <a href="https://github.com/dylansoth/fantasy-football" target="_blank" class="repo-link">View Code Repository</a>
        </footer>
    </div>

</body>
</html>
